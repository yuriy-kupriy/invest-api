services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local development: the superuser is only needed by the rotation script
      # (ALTER ROLE). The app connects as invest_app, whose password lives in a file.
      POSTGRES_DB: invest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5432 is often taken by a locally installed Postgres, so the
      # container is published on 5433. Override with POSTGRES_HOST_PORT.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d invest']
      interval: 5s
      timeout: 3s
      retries: 10

  # Connection pooler in front of Postgres (homework #15). The app and both
  # data-layer scripts go through 6432; only pg_dump and the admin tasks in
  # rotate.sh still talk to 5432 directly, because a pooler in transaction mode
  # is the wrong place for a consistent snapshot and for ALTER ROLE.
  #
  # The entrypoint is overridden on purpose. The image's own /entrypoint.sh
  # generates a config from DB_* / DATABASE_URL environment variables, which is
  # exactly what we do not want when the config is a file in the repo — and it
  # would also react to a stray DATABASE_URL. All it has to do here is copy the
  # read-only seed userlist into the writable path pgbouncer.ini authenticates
  # against, so `bash rotate.sh` can rewrite it in place (see README).
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    entrypoint: ['/bin/sh', '-c']
    command:
      - cp /etc/pgbouncer/userlist.seed.txt /etc/pgbouncer/userlist.txt &&
        exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    ports:
      # Published, not just exposed: the grader connects from the host.
      - '${PGBOUNCER_HOST_PORT:-6432}:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.seed.txt:ro
    healthcheck:
      # Not a bare TCP probe: opening the admin console proves the pooler is
      # listening AND that auth against the userlist works. `docker compose
      # up -d --wait` is the documented grading command, so this gate matters.
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD=postgres psql -h 127.0.0.1 -p 6432 -U postgres -d pgbouncer -tAc "SHOW VERSION" >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  # Pact broker (homework #16) — where consumer contracts and provider
  # verification results meet, and what `can-i-deploy` interrogates before a
  # release. It gets its own Postgres rather than a second database inside the
  # app's: db/init.sql only runs when the pgdata volume is created, so adding a
  # database there would be invisible to anyone with an existing volume.
  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker
    volumes:
      - pactbrokerdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pact_broker -d pact_broker']
      interval: 5s
      timeout: 3s
      retries: 10

  pact-broker:
    # Pinned by tag AND digest: `latest` would make the can-i-deploy gate depend
    # on the day it was pulled, and a version tag alone can still be re-pushed.
    # This is the exact image the README's gate outputs were recorded against.
    image: pactfoundation/pact-broker:3.0.0-pactbroker2.121.2@sha256:420341d4fbfb00a621c313f47e530ad75703f969bbc7520d0d72bc71bb53cef9
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: pact-broker-db
      PACT_BROKER_DATABASE_NAME: pact_broker
      PACT_BROKER_DATABASE_USERNAME: pact_broker
      PACT_BROKER_DATABASE_PASSWORD: pact_broker
      PACT_BROKER_PORT: '9292'
      # No basic auth on the local broker on purpose: it listens on localhost
      # only and the README's curl recipes have to work verbatim. A hosted
      # broker is reached with PACT_BROKER_TOKEN, which never appears here or
      # anywhere else in the repo — see README ## Секрети.
      PACT_BROKER_ALLOW_PUBLIC_READ: 'true'
    ports:
      - '${PACT_BROKER_HOST_PORT:-9292}:9292'
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost can resolve to
      # ::1 and puma listens on IPv4 only, so the probe would never go green
      # and `docker compose up -d --wait` would hang.
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      pact-broker-db:
        condition: service_healthy

  # Message broker (homework #19): order.placed goes out of checkout into
  # invest.events and waits in a quorum queue until the receipts consumer acks
  # it. 4.2 is the LTS line; the -management suffix brings the UI on :15672,
  # which is where x-death on a dead-lettered message can be read by eye.
  # app/app are dev credentials, same status as postgres/postgres above.
  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - '${RABBITMQ_HOST_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_HOST_PORT:-15672}:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      # Not "the port is open": between the TCP listener and the node accepting
      # basic.publish there is a window where clients get ECONNRESET.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 20

  # Redis (homework #23) — two instances on purpose, their eviction policies are
  # incompatible and maxmemory is per process (SELECT 1 does not split it).
  # Cache: bounded memory, allkeys-lru evicts cold keys instead of failing writes.
  redis-cache:
    image: redis:8.2-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - '${REDIS_CACHE_HOST_PORT:-6390}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue (BullMQ) and sessions: nothing may be evicted, BullMQ requires
  # noeviction; AOF everysec loses at most a second of jobs on a crash.
  redis-queue:
    image: redis:8.2-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    ports:
      - '${REDIS_QUEUE_HOST_PORT:-6391}:6379'
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage (homework #26). MinIO's own images are no longer
  # published (minio/minio and quay.io/minio are gone), so this is the pgsty
  # community build of the same server, pinned by tag. hw26user/hw26secretpass
  # are dev credentials, same status as postgres/postgres above. Data lives in
  # tmpfs: every `down` leaves a clean slate; 1g, because on 256m the container
  # dies in the middle of a multipart run.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: hw26user
      MINIO_ROOT_PASSWORD: hw26secretpass
    ports:
      - '${MINIO_HOST_PORT:-22650}:9000'
    tmpfs:
      - /data:size=1g
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/ready']
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev-only DB browser — not part of `docker compose up -d --wait` (grading
  # has no business getting an extra container), opt in with:
  #   docker compose --profile tools up -d pgadmin
  # Then http://localhost:5050 — desktop mode (SERVER_MODE False), so no
  # pgAdmin login; the image still requires the two PGADMIN_DEFAULT_* vars to
  # start. The "invest (docker)" server is pre-registered
  # (pgadmin/servers.json) and pre-authenticated (pgadmin/pgpass — the same
  # non-secret `postgres`/`postgres` dev superuser as above), so it connects
  # with no prompts at all. The pgpass goes through PGPASS_FILE rather than
  # being mounted where libpq reads it: git stores the file as 0644 and libpq
  # ignores a password file with group/world access, so a fresh clone would
  # prompt. The entrypoint copies it into /var/lib/pgadmin/.pgpass with 0600.
  # That copy happens only on first init — after editing pgpass, recreate the
  # pgadmin_data volume.
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@local.dev
      PGADMIN_DEFAULT_PASSWORD: pgadmin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGPASS_FILE: /pgpass
    ports:
      - '${PGADMIN_HOST_PORT:-5050}:80'
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
  pactbrokerdata:
  rabbitmqdata:
  redisqueuedata:
