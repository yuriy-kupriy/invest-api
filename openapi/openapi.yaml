openapi: 3.0.3

info:
  title: Invest API
  version: 1.0.0
  description: |
    Money Manager with detailed investment tracking.

    `Account` and `Transaction` are a single model for cash, bank, brokerage,
    and property; the kind is an enum, not a separate subsystem.

    Conventions for the whole API:

    - **Money is integer cents.** `amount_cents` and `balance_cents` are `integer`.
      No floats and no decimal strings such as `"2600.00"`. Currency is always an
      explicit field (`UAH` / `USD` / `EUR`).
    - **Instrument quantity is `quantity_micro`**, an integer times 10^6. Fractional
      shares are not floats either.
    - **Wire format is `snake_case`.**
    - **Errors are `application/problem+json`** (RFC 9457) with a single `Problem` schema.
    - **Pagination is cursor-based.** The cursor is opaque and belongs to the server.
    - **Time is ISO 8601 UTC** (`format: date-time`).

  contact:
    name: Yurii Kuprii
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:3000
    description: Local app with runtime validation against this spec

# Auth is intentionally absent until homework #24 (JWT + RBAC).
# An explicit empty list satisfies the redocly security-defined rule.
security: []

tags:
  - name: accounts
    description: Accounts — cash, bank, brokerage, property
  - name: transactions
    description: Transactions — income, expenses, transfers, buy and sell

paths:
  /accounts:
    get:
      operationId: listAccounts
      summary: List accounts
      description: Returns a page of accounts sorted by `created_at DESC, id DESC`.
      tags: [accounts]
      parameters:
        - name: limit
          in: query
          required: false
          description: How many accounts to return on one page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: >
            Opaque next-page token issued by the server in `next_cursor`.
            Clients must not parse or construct it: the internal structure belongs
            to the server and may change without notice. The only correct use is
            to send back exactly the value from the previous response.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        '200':
          description: Account page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createAccount
      summary: Create account
      description: >
        Creates an account with a zero or given opening balance.
        Returns `201` with a `Location` header pointing at the created resource.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account created
          headers:
            Location:
              description: URI of the created account
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /accounts/{account_id}:
    get:
      operationId: getAccount
      summary: Get account
      tags: [accounts]
      parameters:
        - name: account_id
          in: path
          required: true
          description: Account identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /transactions:
    get:
      operationId: listTransactions
      summary: List transactions
      description: >
        Returns a page of transactions sorted by `occurred_at DESC, id DESC`.
        Optional `account_id` filter narrows the result to one account.
      tags: [transactions]
      parameters:
        - name: account_id
          in: query
          required: false
          description: Show transactions for this account only.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: How many transactions to return on one page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: >
            Opaque next-page token issued by the server in `next_cursor`.
            Clients must not parse or construct it: the internal structure belongs
            to the server and may change without notice. The only correct use is
            to send back exactly the value from the previous response.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        '200':
          description: Transaction page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createTransactions
      summary: Create transactions as a batch
      description: >
        Creates one or more transactions in a single request — manual entry, statement
        import, or a transfer between own accounts (`transfer_out` + `transfer_in` as
        two items). The batch is applied atomically: either every `entries` row is
        created, or none. Account balances are updated in the same operation.
      tags: [transactions]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Safe-retry key. The same key with the same body returns the same response —
            the same `201` and the same set of transactions, plus `Idempotency-Replay: true`;
            the handler does not run again and no new rows appear. The same key with a
            different body yields `422`, because the key was already spent on another
            operation. A request still in flight yields `409`. The key lives 24 hours,
            after which the same string may be used as new. There is no standard for this
            header: IETF draft `draft-ietf-httpapi-idempotency-key-header` stopped at
            revision -07 and expired, so the semantics are spelled out here and follow Stripe.
          schema:
            type: string
            minLength: 8
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionsRequest'
      responses:
        '201':
          description: Transactions created
          headers:
            Idempotency-Replay:
              description: >
                Present with value `true` when this is a replay of a request with the
                same `Idempotency-Key` and the same body. No new transactions are created.
              required: false
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'

  /transactions/{transaction_id}:
    get:
      operationId: getTransaction
      summary: Get transaction
      tags: [transactions]
      parameters:
        - name: transaction_id
          in: path
          required: true
          description: Transaction identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    BadRequest:
      description: The request failed validation against this spec
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: Conflict with resource state — for example this Idempotency-Key is still in flight
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unprocessable:
      description: The body is syntactically valid but conflicts with state — for example Idempotency-Key reuse
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: |
        Single error format — RFC 9457 (`application/problem+json`).
        The five base fields are always required; `code` and `errors` are extensions of this API.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: Error type URI — a stable identifier clients use to distinguish cases.
          example: https://api.invest.example/problems/idempotency-key-reuse
        title:
          type: string
          description: Short human-readable name of the error type, the same for every instance of that type.
          example: Request body failed validation
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status duplicated in the body so the problem stays self-contained in logs.
          example: 422
        detail:
          type: string
          description: What went wrong in this specific case.
          example: Idempotency-Key has already been used with a different request body
        instance:
          type: string
          description: Reference to this occurrence — the request URI that caused the error.
          example: /transactions
        code:
          type: string
          description: Machine-readable error code — an extension of this API on top of RFC 9457.
          example: idempotency-key-reuse
        errors:
          type: array
          description: Per-field details when several validation errors occurred.
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                example: /body/entries
              message:
                type: string
                example: must NOT have fewer than 1 items

    Account:
      type: object
      description: An account of any kind — from a cash wallet to a property object.
      required: [id, name, type, currency, balance_cents, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: IBKR brokerage
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/Currency'
        balance_cents:
          type: integer
          format: int64
          description: >
            Current balance in cents of the account currency. For `property` — estimated value.
            Integer only: money is never a float.
          example: 1250000
        created_at:
          type: string
          format: date-time

    AccountCreate:
      type: object
      additionalProperties: false
      required: [name, type, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: IBKR brokerage
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/Currency'
        opening_balance_cents:
          type: integer
          format: int64
          default: 0
          description: Opening balance in cents. Integer only.
          example: 1250000

    AccountType:
      type: string
      description: |
        Account type. Investments are not a separate subsystem, they are values of this enum:
        `brokerage` holds securities, `property` holds real estate.
      enum: [cash, bank, brokerage, property]
      example: brokerage

    TransactionType:
      type: string
      description: |
        Transaction type. It also defines the money direction, so `amount_cents` is always non-negative:

        - inflow — `income`, `transfer_in`, `sell`
        - outflow — `expense`, `transfer_out`, `buy`

        A transfer between own accounts is two transactions (`transfer_out` and `transfer_in`)
        in one batch, applied atomically.

        `buy` and `sell` apply to `brokerage` accounts and fill
        `instrument_symbol` and `quantity_micro`.
      enum: [income, expense, transfer_in, transfer_out, buy, sell]
      example: buy

    Currency:
      type: string
      description: |
        Account or transaction currency. Currently limited to `UAH`, `USD`, and `EUR`.
      enum: [UAH, USD, EUR]
      example: UAH

    Transaction:
      type: object
      description: >
        One operation on an account. The sign of the money movement comes from `type`,
        not from the sign of `amount_cents`: `amount_cents` is always non-negative.
      required:
        - id
        - account_id
        - type
        - amount_cents
        - currency
        - occurred_at
        - description
        - instrument_symbol
        - quantity_micro
        - created_at
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        amount_cents:
          type: integer
          format: int64
          minimum: 0
          description: Amount in cents, always non-negative. Integer only.
          example: 4599
        currency:
          $ref: '#/components/schemas/Currency'
        occurred_at:
          type: string
          format: date-time
          description: When the operation happened in the real world — unlike `created_at`.
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Optional user comment. `null` if omitted.
          example: Buy 10 shares of VOO
        instrument_symbol:
          type: string
          maxLength: 20
          nullable: true
          description: Instrument ticker for `buy`/`sell`. `null` for other types.
          example: VOO
        quantity_micro:
          type: integer
          format: int64
          nullable: true
          description: >
            Instrument quantity times 10^6 so fractional shares stay an integer.
            10 shares = `10000000`. `null` for non-investment types.
          example: 10000000
        created_at:
          type: string
          format: date-time

    TransactionEntry:
      type: object
      description: One item in a create-transactions batch.
      additionalProperties: false
      required: [account_id, type, amount_cents, currency, occurred_at]
      properties:
        account_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        amount_cents:
          type: integer
          format: int64
          minimum: 0
          example: 4599
        currency:
          $ref: '#/components/schemas/Currency'
        occurred_at:
          type: string
          format: date-time
        description:
          type: string
          maxLength: 500
          nullable: true
        instrument_symbol:
          type: string
          maxLength: 20
          nullable: true
        quantity_micro:
          type: integer
          format: int64
          nullable: true

    CreateTransactionsRequest:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          description: Non-empty list of transactions created atomically.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TransactionEntry'

    TransactionBatch:
      type: object
      description: Batch result — created transactions in the same order as `entries`.
      required: [transactions]
      properties:
        transactions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Transaction'

    AccountPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        next_cursor:
          type: string
          nullable: true
          description: >
            Opaque next-page token. `null` means there are no more pages —
            the client does not count pages or compare `items` length to `limit`.
          example: eyJjIjoiMjAyNi0wOC0yNVQxMDowMDowMFoiLCJpZCI6IjllOWMifQ

    TransactionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        next_cursor:
          type: string
          nullable: true
          description: >
            Opaque next-page token. `null` means there are no more pages —
            the client does not count pages or compare `items` length to `limit`.
          example: eyJjIjoiMjAyNi0wOC0yNVQxMDowMDowMFoiLCJpZCI6IjllOWMifQ
