; PgBouncer in front of the course-project Postgres (homework #15).
;
; The file is mounted read-only into the container; nothing here is a
; production-grade secret — the two dev passwords it authenticates against are
; already in the open in docker-compose.yml and db/init.sql.

[databases]
; `postgres` is the compose service name: compose declares no networks and no
; container_name, so the default network resolves the service by its own name.
; Port 5432 is the container port, not the published 5433.
invest = host=postgres port=5432 dbname=invest

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Plaintext passwords in the auth file with scram-sha-256 is deliberate, and is
; the only shape that works in both directions: PgBouncer computes the SCRAM
; exchange for the client from the plaintext, and logs in to Postgres with the
; same value. A stored SCRAM verifier (what auth_query returns) can only verify
; a client — PgBouncer cannot authenticate to the server with it.
auth_type = scram-sha-256

; NOT the path the repo file is mounted at. docker-compose mounts
; pgbouncer/userlist.txt read-only as userlist.seed.txt and the container copies
; it here on start, so rotate.sh can write the rotated password into the running
; pooler and SIGHUP it without ever dirtying the file that lives in git.
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

; The point of the homework. A server connection is held only for the duration
; of one transaction, so N app connections no longer mean N Postgres backends.
; What it costs is in the README: session state does not survive a COMMIT.
pool_mode = transaction

; Deliberately smaller than what the app asks for (DB_POOL_MAX=10, and
; demo:race fires 50 concurrent checkouts): the ceiling is what makes the
; pooling visible in SHOW POOLS.
default_pool_size = 5
reserve_pool_size = 2
reserve_pool_timeout = 3

; Room on the client side — this is the number the pooler exists to decouple
; from default_pool_size.
max_client_conn = 200

; Not needed by this code (node-postgres sends unnamed extended-protocol
; statements), but it is the switch that makes a driver with named prepared
; statements survive transaction mode. PgBouncer >= 1.21.
max_prepared_statements = 200

; libpq-based clients send these in the startup packet; without the exemption
; PgBouncer refuses the connection instead of ignoring the parameter.
ignore_startup_parameters = extra_float_digits,options

; Empty: log to stderr and let Docker collect it, no pidfile in a container.
logfile =
pidfile =
